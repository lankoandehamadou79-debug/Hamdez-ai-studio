
name: Build FOOTBALL AI PRO APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Creer les fichiers Android
        run: flutter create --platforms=android --project-name football_ai_pro --org com.hamdez .

      - name: Ajouter autorisation Internet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'

          if permission not in content:
              content, count = re.subn(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n' + permission,
                  content,
                  count=1
              )
              if count == 0:
                  raise Exception("Balise manifest introuvable")
              path.write_text(content)
          PY

      - name: Installer les dependances
        run: flutter pub get

      - name: Compiler APK
        run: flutter build apk --release

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: FOOTBALL-AI-PRO-APK
          path: build/app/outputs/flutter-apk/app-release.apk
