
name: Build FOOTBALL AI PRO APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Creer les fichiers Android
        run: flutter create --platforms=android --project-name football_ai_pro --org com.hamdez .

      - name: Installer les dependances
        run: flutter pub get

      - name: Compiler APK
        run: flutter build apk --release

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: FOOTBALL-AI-PRO-APK
          path: build/app/outputs/flutter-apk/app-release.apk
